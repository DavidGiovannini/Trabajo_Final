<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar — S. Valvo y Cía</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos propios de la pantalla de login -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="login-wrap">

    <!-- Marca: nombre de la empresa sobre la card -->
    <div class="login-brand">
      <div class="brand-name">S. Valvo y Cía</div>
      <div class="brand-sub">Muebles a medida · Panel de administración</div>
    </div>

    <!-- Card de login -->
    <div class="card login-card">

      <!-- Encabezado azul -->
      <div class="login-card-header">
        <i class="bi bi-shield-lock me-2"></i>Acceso interno
      </div>

      <!-- Cuerpo con formulario -->
      <div class="login-card-body">

        <!-- Mensajes flash (errores de credenciales, etc.) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ category }} rounded-3 py-2 small mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Formulario de autenticación -->
        <form method="post" action="/login">

          <div class="mb-3">
            <label class="form-label fw-semibold small mb-1">Usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input class="form-control" name="username" placeholder="admin"
                     autocomplete="username">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold small mb-1">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input class="form-control" type="password" name="password"
                     placeholder="••••••••" autocomplete="current-password">
            </div>
          </div>

          <button type="submit" class="btn btn-login w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
          </button>

        </form>

      </div>
    </div>

    <!-- Aviso de acceso restringido -->
    <div class="login-footer">Red LAN interna &nbsp;·&nbsp; Solo usuarios autorizados</div>

  </div>
</body>
</html>
